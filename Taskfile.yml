# NCEA Review Navigator — task runner (https://taskfile.dev)
# Install: brew install go-task     ·     List everything: task --list  (or just: task)
#
# PHILOSOPHY: start small LOCAL (this Mac), scale to Docker LATER.
# Day-to-day dev is plain local Python + static HTML/CSS/JS — no containers, no
# daemon, fastest feedback. Docker (docker:*) is the same app in containers, kept
# ready for parity / deployment / scaling, but it is NOT needed for development.
#
# ── Getting started (local, macOS — start here) ───────────────────────────
#   task setup       # one-time: venv + backend deps + create the database
#   task web:dev     # frontend mockup in the browser (mock backend — no Flask/DB)
#   task api:dev     # backend API (separate terminal), only when you need it
#   task api:check   # local quality gate: lint + tests
# ── Scale later ───────────────────────────────────────────────────────────
#   task docker:up   # run the whole stack (web + api + db) in containers
#
# Tasks are isolated by tier:
#   web:*  FRONTEND  ·  api:*  BACKEND  ·  db:*  DATABASE  ·  docker:*  FULL STACK
# Override ports inline, e.g.  task api:dev API_PORT=5055
version: "3"

includes:
  # Local tiers first — the everyday path.
  web: ./taskfiles/web.yml
  api: ./taskfiles/api.yml
  db: ./taskfiles/db.yml
  # Scale-up path — same app, in containers.
  docker: ./taskfiles/docker.yml

tasks:
  default:
    desc: "List all tasks"
    cmds: [task --list]
    silent: true

  setup:
    desc: "LOCAL one-time bootstrap — venv + backend deps + create the database"
    cmds:
      - task: api:install
      - task: db:init

  clean:
    desc: "Remove venv, caches, and local dev databases"
    cmds:
      - rm -rf back-end/.venv back-end/.pytest_cache back-end/.ruff_cache
      - find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
      - find . -name '*.db' -not -path '*/.git/*' -delete 2>/dev/null || true
