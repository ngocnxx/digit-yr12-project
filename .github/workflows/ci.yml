name: CI

# Day to day, run this on your own Mac with act (runs GitHub Actions locally in Docker):
#   act workflow_dispatch -W .github/workflows/ci.yml
# On GitHub it only runs when a version tag (v1.0.0, v1.1.0, ...) is pushed, and only
# if that tag is on the main branch. It can also be started by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history, so we can check the tag is on main

      - name: Tag must be on main
        if: github.ref_type == 'tag'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "Tag $GITHUB_REF_NAME is not on main. Tag a commit on main."; exit 1; }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No ruff steps: the code stays exactly as submitted (never run ruff format on it),
      # and ruff is not in requirements.txt. The tests are what prove the app works.
      - name: Tests (pytest)
        run: pytest
