# FRONTEND tasks, HOST MODE (no Docker) — serve the SPA with python3 -m http.server.
# The page calls the API on :5050, so run `task api:dev` too for a working app.
# Invoked as `task web:<name>` from the repo root. Docker-first: see `task up`.
version: "3"

vars:
  WEB_PORT: '{{.WEB_PORT | default "5500"}}'

tasks:
  dev:
    desc: "Host mode: serve the SPA on :{{.WEB_PORT}} (needs `task api:dev` for the API)"
    cmds:
      - 'echo "Open http://127.0.0.1:{{.WEB_PORT}}/   (API expected on http://127.0.0.1:5050 — task api:dev)"'
      - WEB_PORT={{.WEB_PORT}} {{.ROOT_DIR}}/scripts/run-web.sh

  prototype:
    desc: "Build the standalone 3-file mockup → README/prototype/ (index.html + styles.css + app.js)"
    cmd: python3 {{.ROOT_DIR}}/scripts/build-prototype.py

  open:
    desc: "Host mode: serve the SPA AND open it in your browser (Ctrl+C to stop)"
    # web:dev is a long-running server, so it can't be a dependency (it never
    # "finishes"). Instead: background a short wait → open the tab, and run the
    # server in the foreground (the npm-start feel).
    cmd: |
      ( sleep 1 && open "http://127.0.0.1:{{.WEB_PORT}}/" ) &
      WEB_PORT={{.WEB_PORT}} {{.ROOT_DIR}}/scripts/run-web.sh
