# Two sites in one container:
#   :5500 the page for split-origin dev. config.js sends API calls to :5050 (CORS).
#   :8080 the "edge", shaped like CloudFront: one origin, /api/* forwarded to
#         Flask, the production security headers, and no index.html fallback.
# Both forward /api/*, so the page also works from one address (Codespaces).

# Docker's DNS, looked up per request: nginx starts even while the api is down.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 5500;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA (hash router). Fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
        # Always check for a newer version (a tiny 304 reply when nothing changed),
        # so browsers never keep running old JavaScript after an update.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/ {
        set $api http://api:5000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Flask accepts up to 3 MiB (a photo); nginx's own default is only 1 MiB
        client_max_body_size 4m;
        proxy_read_timeout 30s;
    }
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Like the private S3 bucket behind CloudFront: a missing file is a 403,
    # never index.html. Headers match the CloudFront response headers policy
    # (HSTS left out: this is plain HTTP).
    location / {
        try_files $uri $uri/ =403;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        include /etc/nginx/snippets/csp.conf;
    }

    location /api/ {
        set $api http://api:5000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
        proxy_read_timeout 30s;
    }
}
