server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA (hash router). Fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No /api proxy here — the API is a separate origin (CORS handles it).
}
