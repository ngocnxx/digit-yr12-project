server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA (hash router). Fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
        # Always check for a newer version (a tiny 304 reply when nothing changed),
        # so browsers never keep running old JavaScript after an update.
        add_header Cache-Control "no-cache" always;
    }

    # No /api proxy here — the API is a separate origin (CORS handles it).
}
