# NCEA Review Navigator — local stack (Docker first). Easiest via task:
#   task up        build + start, wait until healthy, print the addresses
#   task verify    the Definition of Done gate (tests, image, smoke, S3 mode)
# Or plain compose:  docker compose up --build
#   web  -> http://127.0.0.1:5500   the page; API calls go to :5050 (split origin, CORS)
#   edge -> http://127.0.0.1:8080   one origin like CloudFront: /api/* forwarded, production CSP
#   api  -> http://127.0.0.1:5050   the Flask JSON API (gunicorn)
#
# Values default to dev-safe settings; override any of them in a root .env file
# (copy .env.example).
#
# Why the API host port is 5050, not 5000: on macOS, AirPlay Receiver
# (ControlCenter) permanently occupies port 5000, which made `docker compose up`
# and the VS Code devcontainer fail with "address already in use". The container
# still listens on 5000 internally; only the published host port moved. Override
# either side via a root .env, e.g. `echo "API_PORT=5000" >> .env` (then point
# front-end/js/config.js API_BASE at the matching port).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: ./back-end
    ports:
      - "${API_PORT:-5050}:5000"
    environment:
      SECRET_KEY: "${SECRET_KEY:-dev-insecure-change-me}"
      DATABASE_PATH: "/app/data/navigator.db"
      # A pattern, so the page works from 127.0.0.1 or localhost (5501 = preview port)
      CORS_ORIGIN: '${CORS_ORIGIN:-^http://(127\.0\.0\.1|localhost):550[01]$}'
    volumes:
      - db_data:/app/data
    restart: unless-stopped
    logging: *logging
    # /api/health also opens the database, so "healthy" means the app can serve.
    # (The slim image has no curl, so Python asks.)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s
    # `task dev` (docker compose up --watch): copy code changes in, restart gunicorn
    develop:
      watch:
        - action: rebuild
          path: ./back-end/requirements.txt
        - action: sync+restart
          path: ./back-end
          target: /app
          ignore:
            - tests/
            - requirements.txt

  web:
    build: ./front-end
    ports:
      - "${WEB_PORT:-5500}:80"
      - "${EDGE_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    # `task dev`: page edits show up on the next reload, no rebuild needed
    develop:
      watch:
        - action: sync
          path: ./front-end/js
          target: /usr/share/nginx/html/js
        - action: sync
          path: ./front-end/index.html
          target: /usr/share/nginx/html/index.html
        - action: sync
          path: ./front-end/style.css
          target: /usr/share/nginx/html/style.css
        # nginx settings and the CSP hash (from index.html) are baked at build
        - action: rebuild
          path: ./front-end/nginx.conf
        - action: rebuild
          path: ./front-end/Dockerfile

  # --- Optional: the "database in S3" mode (back-end/s3db.py) ----------------
  # Off unless you ask for it:
  #   task smoke:s3     (or: docker compose --profile s3 up --build -d && scripts/smoke-s3.sh)
  # "s3" is moto, a free local stand-in for Amazon S3 (5.1.21 was checked to
  # follow S3's If-Match / If-None-Match rules). Two API copies share one
  # database object, like two AWS Lambda copies would.
  s3:
    image: motoserver/moto:5.1.21
    profiles: ["s3"]

  s3-init:
    build: ./back-end
    profiles: ["s3"]
    depends_on:
      - s3
    environment: &s3-credentials
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-southeast-2
    # Make a versioned bucket (waits for the fake S3 to start)
    command:
      - python
      - -c
      - |
        import time, boto3
        from botocore.config import Config
        s3 = boto3.client("s3", endpoint_url="http://s3:5000", config=Config(s3={"addressing_style": "path"}))
        for _ in range(30):
            try:
                s3.create_bucket(Bucket="nrn-data-local", CreateBucketConfiguration={"LocationConstraint": "ap-southeast-2"})
                break
            except s3.exceptions.BucketAlreadyOwnedByYou:
                break
            except Exception:
                time.sleep(1)
        s3.put_bucket_versioning(Bucket="nrn-data-local", VersioningConfiguration={"Status": "Enabled"})
        print("bucket ready")

  api-s3a: &api-s3
    build: ./back-end
    profiles: ["s3"]
    depends_on:
      s3-init:
        condition: service_completed_successfully
    ports:
      - "5061:5000"
    environment:
      <<: *s3-credentials
      SECRET_KEY: "local-s3-test-key-shared-by-both-copies-0123456789"
      DATABASE_PATH: "/tmp/navigator.db"
      S3DB_BUCKET: nrn-data-local
      S3DB_ENDPOINT_URL: "http://s3:5000"
      GUNICORN_CMD_ARGS: "--workers 1 --threads 1"
      CORS_ORIGIN: '^http://(127\.0\.0\.1|localhost):550[01]$$'

  api-s3b:
    <<: *api-s3
    ports:
      - "5062:5000"

volumes:
  db_data:
